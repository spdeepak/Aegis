token:
  bearer:
    ttl: 15m
  refresh:
    ttl: 168m
  issuer: go-jwt-server
postgres:
  host: localhost
  dbName: jwt_server
  port: 5432
  timeout: 10s
  maxRetry: 5
  sslMode: disable
  connectTimeout: 10s
  statementTimeout: 15s
  maxOpenConns: 5
  maxIdleConns: 2
  connMaxLifetime: 10m
  connMaxIdleTime: 2m
  healthCheckPeriod: 1m
auth:
  skipPaths:
#    - /api/v1/access-control/roles
#    - /api/v1/access-control/roles/{id}
  rateLimit:
    enabled: true
    backend: postgres          # postgres (default) | redis | memory
    maxAttempts: 5
    window: 1m
    lockoutDuration: 15m
    # CIDRs of reverse proxies / CDNs (e.g. Cloudflare, k8s ingress) allowed to
    # assert the real client IP via X-Forwarded-For. Empty => use RemoteAddr.
    trustedProxies: []
    # Throttle login attempts per (client IP + email) so an attacker cannot lock
    # out a victim's account by bombing their email from the attacker's IP.
    accountAware: true
    redis:
      addr: ""
      password: ""
      db: 0